name: PR Build Comment

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only read GitHub metadata. Do not download artifacts or execute PR code.
      - name: Link test APKs on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.conclusion === 'cancelled') return;
            let number = run.pull_requests?.[0]?.number;
            if (!number && run.head_repository?.owner?.login && run.head_branch) {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`, per_page: 100
              });
              number = pulls.find(pr => pr.head.sha === run.head_sha && pr.base.ref === 'main')?.number;
            }
            if (!number) return;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha) {
              core.info('Ignoring a closed PR or a build for an older commit.');
              return;
            }
            const marker = '<!-- mpvnova-pr-build -->';
            const lines = [marker, `Build for \`${run.head_sha.slice(0, 7)}\`.`, ''];
            if (run.conclusion === 'success') {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              const apk = artifacts.find(item => item.name === 'pr-debug-apks' && !item.expired);
              if (apk) {
                const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${apk.id}`;
                lines.push(`[Download test APKs](${url})`, '',
                  'Universal debug APKs: normal and target-API-29. Sign in to GitHub to download; available for 14 days.',
                  'Unreviewed test builds, not official releases. Debug signatures cannot update an official release; use a test device or emulator.');
              } else {
                lines.push('The build passed, but the test APK artifact is unavailable.');
              }
            } else {
              lines.push(`Build did not pass (${run.conclusion || 'unknown'}).`);
            }
            lines.push('', `[Build logs](${run.html_url})`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100
            });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker));
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }
