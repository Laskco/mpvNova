name: libass FLE debug comparison
on:
  push:
    branches: [libass-fle-performance]
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Android architecture
        type: choice
        default: arm64
        options: [arm64, armv7l]
permissions:
  contents: read
env:
  LIBASS_REF: 8a802eac73ecfe498278780a57af4e0ec15a858d
jobs:
  shield:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH: ${{ inputs.architecture || 'arm64' }}
      ABI: ${{ inputs.architecture == 'armv7l' && 'armeabi-v7a' || 'arm64-v8a' }}
      PREFIX_VARIABLE: ${{ inputs.architecture == 'armv7l' && 'PREFIX32' || 'PREFIX64' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build gperf nasm
          python3 -m pip install --break-system-packages meson
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: |
            buildscripts/prefix
            buildscripts/deps
            buildscripts/sdk
          key: fle-native-${{ env.ARCH }}-current-stack-v1
      - name: Prepare Android toolchain
        run: |
          set -euo pipefail
          chmod +x gradlew buildscripts/include/*.sh buildscripts/scripts/*.sh buildscripts/buildall.sh
          mkdir -p buildscripts/sdk
          if [ ! -d buildscripts/sdk/android-ndk-r30 ]; then
            curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/ndk.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d buildscripts/sdk
          fi
          test -d buildscripts/sdk/android-sdk-linux || ln -s "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux
          test -d "$ANDROID_HOME/ndk/30.0.16248370" || ln -s "$PWD/buildscripts/sdk/android-ndk-r30" "$ANDROID_HOME/ndk/30.0.16248370"
      - name: Build unchanged native baseline
        run: |
          set -euo pipefail
          cd buildscripts
          if [ ! -f "prefix/$ARCH/lib/libmpv.so" ]; then
            ./include/download-deps.sh
            ./buildall.sh --arch "$ARCH" --only-deps mpvnova
          fi
          ndk="$PWD/sdk/android-ndk-r30"
          "$ndk/ndk-build" -C ../app/src/main -j2 "$PREFIX_VARIABLE=$PWD/prefix/$ARCH" "APP_ABI=$ABI"
          cp "prefix/$ARCH/lib/"*.so "../app/src/main/jniLibs/$ABI/"
          cp "../app/src/main/libs/$ABI/"*.so "../app/src/main/jniLibs/$ABI/"
          # No renderer, audio filter, or decoder feature is removed for this test.
          grep -qx '#define HAVE_LIBCURL 1' "deps/mpv/_build_$ARCH/config.h"
          grep -qx '#define CONFIG_ACOMPRESSOR_FILTER 1' "deps/ffmpeg/_build_$ARCH/config_components.h"
          git -C deps/mpv apply --reverse --check ../../patches/mpv-dovi-fel-toggle.patch
          git -C deps/mpv apply --reverse --check ../../patches/mpv-external-subtitle-url.patch
      - uses: actions/cache/save@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            buildscripts/prefix
            buildscripts/deps
            buildscripts/sdk
          key: fle-native-${{ env.ARCH }}-current-stack-v1
      - uses: gradle/actions/setup-gradle@v5
      - name: Build baseline debug app
        run: |
          ./gradlew :app:assembleDefaultDebug :app:testDefaultDebugUnitTest --console=plain
          mkdir -p comparison
          cp "app/build/outputs/apk/default/debug/app-default-$ABI-debug.apk" comparison/baseline-debug.apk
          cp "app/src/main/jniLibs/$ABI/libmpv.so" comparison/baseline-libmpv.so
      - name: Rebuild only libass and relink the same mpv
        run: |
          set -euo pipefail
          cd buildscripts
          # The baseline is already packaged. This checkout is CI scratch only.
          rm -rf deps/libass
          git clone https://github.com/Laskco/libass.git deps/libass
          git -C deps/libass checkout "$LIBASS_REF"
          git -C deps/libass rev-parse HEAD > ../comparison/libass-revision.txt
          ./buildall.sh --arch "$ARCH" -n libass
          export PATH="$PWD/sdk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "deps/libass/_build_$ARCH"
          make clean
          make -j2 CPPFLAGS=-DASS_EVENT_THREADS
          make DESTDIR="$GITHUB_WORKSPACE/buildscripts/prefix/$ARCH" install
          cd ../../..
          ./buildall.sh --arch "$ARCH" -n --clean mpv
          cp "prefix/$ARCH/lib/libmpv.so" "../app/src/main/jniLibs/$ABI/libmpv.so"
      - name: Build candidate debug app
        run: |
          ./gradlew :app:assembleDefaultDebug --console=plain
          cp "app/build/outputs/apk/default/debug/app-default-$ABI-debug.apk" comparison/candidate-debug.apk
          cp "app/src/main/jniLibs/$ABI/libmpv.so" comparison/candidate-libmpv.so
          sha256sum comparison/*.apk comparison/*.so > comparison/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: libass-debug-comparison-${{ env.ABI }}
          if-no-files-found: error
          path: comparison/
