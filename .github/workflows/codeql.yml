name: codeql

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '24 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Fix Gradle permissions
        run: chmod +x gradlew

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        # CodeQL 2.27.0 requires Kotlin < 2.4.20. Remove the override once supported.
        # Always compile under tracing instead of restoring cached compiler output.
        run: >-
          ./gradlew :app:assembleDefaultDebug --no-daemon
          -PcodeqlKotlinVersion=2.4.10
          --no-build-cache --no-configuration-cache --rerun-tasks

      - uses: github/codeql-action/analyze@v4
