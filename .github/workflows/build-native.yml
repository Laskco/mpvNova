name: build-native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7l, arm64, x86, x86_64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Fix script permissions
        run: chmod +x buildscripts/include/*.sh buildscripts/scripts/*.sh buildscripts/buildall.sh

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build python3-pip gperf nasm
          python3 -m pip install --break-system-packages meson

      - name: Prepare Android toolchain
        run: |
          set -euo pipefail
          . buildscripts/include/depinfo.sh
          mkdir -p buildscripts/sdk/bin
          curl -fL --retry 3 "https://dl.google.com/android/repository/android-ndk-${v_ndk}-linux.zip" -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d buildscripts/sdk
          grep -qF "$v_ndk_n" "buildscripts/sdk/android-ndk-${v_ndk}/source.properties"
          ln -s "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux
          curl -fL --retry 3 https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl -o buildscripts/sdk/bin/gas-preprocessor.pl
          chmod +x buildscripts/sdk/bin/gas-preprocessor.pl

      - name: Download deps
        run: |
          cd buildscripts
          ./include/download-deps.sh

      - name: Build native libraries (${{ matrix.arch }})
        run: |
          cd buildscripts
          ./buildall.sh --arch ${{ matrix.arch }} --only-deps mpvnova

      - name: Build libplayer.so (${{ matrix.arch }})
        run: |
          NDK_DIR=$(echo buildscripts/sdk/android-ndk-*)
          export PATH="$NDK_DIR:$PATH"

          arch=${{ matrix.arch }}
          prefix="$PWD/buildscripts/prefix"
          if [ "$arch" = "armv7l" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX32="$prefix/armv7l" \
              APP_ABI=armeabi-v7a
          elif [ "$arch" = "arm64" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX64="$prefix/arm64" \
              APP_ABI=arm64-v8a
          elif [ "$arch" = "x86" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX_X86="$prefix/x86" \
              APP_ABI=x86
          elif [ "$arch" = "x86_64" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX_X64="$prefix/x86_64" \
              APP_ABI=x86_64
          fi

      - name: Verify subtitle assembly (${{ matrix.arch }})
        run: |
          arch=${{ matrix.arch }}
          expected=1
          if [ "$arch" = "armv7l" ]; then expected=0; fi
          grep -qx "#define CONFIG_ASM $expected" "buildscripts/deps/libass/_build_$arch/config.h"
          echo "libass assembly: $expected ($arch)"
          . buildscripts/include/depinfo.sh
          test "$(git -C buildscripts/deps/libass rev-parse HEAD)" = "$v_libass"
          grep -q -- '-DASS_EVENT_THREADS' "buildscripts/deps/libass/_build_$arch/Makefile"

      - name: Verify native configuration and patches (${{ matrix.arch }})
        run: |
          grep -qx '#define HAVE_LIBCURL 1' "buildscripts/deps/mpv/_build_${{ matrix.arch }}/config.h"
          grep -qx '#define CONFIG_ACOMPRESSOR_FILTER 1' "buildscripts/deps/ffmpeg/_build_${{ matrix.arch }}/config_components.h"
          git -C buildscripts/deps/mpv apply --reverse ../../patches/mpv-dovi-fel-toggle.patch
          git -C buildscripts/deps/mpv apply --reverse ../../patches/mpv-external-subtitle-url.patch
          git -C buildscripts/deps/mpv diff --exit-code
          test -z "$(git -C buildscripts/deps/mpv status --porcelain --untracked-files=no)"

      - name: Collect .so files
        run: |
          arch=${{ matrix.arch }}
          mkdir -p collected

          if [ "$arch" = "armv7l" ]; then abi="armeabi-v7a"
          elif [ "$arch" = "arm64" ]; then abi="arm64-v8a"
          elif [ "$arch" = "x86" ]; then abi="x86"
          elif [ "$arch" = "x86_64" ]; then abi="x86_64"
          fi

          cp buildscripts/prefix/$arch/lib/*.so collected/
          cp app/src/main/libs/$abi/*.so collected/
          for lib in libplayer libmpv libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale libc++_shared; do
            test -s "collected/$lib.so"
          done

      - name: Verify 16 KB ELF and RELRO alignment (${{ matrix.arch }})
        if: matrix.arch == 'arm64' || matrix.arch == 'x86_64'
        run: |
          NDK_DIR=$(echo buildscripts/sdk/android-ndk-*)
          readelf="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for lib in collected/*.so; do
            headers=$("$readelf" -lW "$lib")
            while read -r align; do
              if (( align < 16384 )); then
                echo "Invalid 16 KB load alignment: $lib ($align)" >&2
                exit 1
              fi
            done < <(printf '%s\n' "$headers" | awk '$1 == "LOAD" { print $NF }')
            while read -r address size; do
              if (( (address + size) % 16384 != 0 )); then
                echo "Invalid 16 KB RELRO alignment: $lib" >&2
                exit 1
              fi
            done < <(printf '%s\n' "$headers" | awk '$1 == "GNU_RELRO" { print $3, $6 }')
            echo "16 KB ELF and RELRO alignment verified: $lib"
          done

      - name: Upload .so files
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-${{ matrix.arch }}
          if-no-files-found: error
          path: collected/*.so

  bundle:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-libs

      - name: Organize by ABI
        run: |
          mkdir -p jniLibs/armeabi-v7a jniLibs/arm64-v8a jniLibs/x86 jniLibs/x86_64
          cp all-libs/native-libs-armv7l/*.so jniLibs/armeabi-v7a/
          cp all-libs/native-libs-arm64/*.so jniLibs/arm64-v8a/
          cp all-libs/native-libs-x86/*.so jniLibs/x86/
          cp all-libs/native-libs-x86_64/*.so jniLibs/x86_64/

      - name: Upload combined jniLibs
        uses: actions/upload-artifact@v7
        with:
          name: jniLibs-all-abis
          path: jniLibs/

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APKs with rebuilt libraries
        run: |
          cp -a jniLibs/. app/src/main/jniLibs/
          chmod +x gradlew
          ./gradlew :app:assembleDefaultRelease :app:testDefaultDebugUnitTest :app:detekt --console=plain

      - name: Upload unsigned release APKs for local signing
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-release-apks-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/default/release/*-unsigned.apk
