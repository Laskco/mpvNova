name: build-anitomy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Android NDK
        run: |
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
      - name: Build parser for all Android architectures
        shell: pwsh
        run: ./buildscripts/build-anitomy.ps1 -AndroidNdk "$env:RUNNER_TEMP/android-ndk-r30"
      - name: Upload parser libraries
        uses: actions/upload-artifact@v7
        with:
          name: anitomy-android-all-abis
          if-no-files-found: error
          path: app/src/main/jniLibs/*/libmpvnova_anitomy.so
