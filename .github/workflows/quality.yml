name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Fix Gradle permissions
        run: chmod +x gradlew

      - name: Run Android quality checks
        run: ./gradlew :app:lintDefaultDebug :app:testDefaultDebugUnitTest :app:detekt --no-daemon

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-defaultDebug.*
            app/build/reports/tests/testDefaultDebugUnitTest/
            app/build/test-results/testDefaultDebugUnitTest/
            app/build/reports/detekt/
